<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZODIAC AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">ZODIAC</div>

    <button id="menuBtn" class="menu-btn">☰</button>
</header>

<aside id="menu">

    <div class="menu-title">ZODIAC AI</div>

    <button>💬 چت هوشمند</button>
    <button>💻 برنامه‌نویسی</button>
    <button>🎨 ساخت تصویر</button>
    <button>✏️ ویرایش تصویر</button>
    <button>📁 فایل‌ها</button>
    <button>🌐 جست‌وجو</button>
    <button>🎙️ صدا</button>
    <button>🧠 حافظه</button>

</aside>

<main>

    <section class="welcome">

        <div class="zodiac-icon">✦</div>

        <h1>
            سلام، من <span>ZODIAC</span> هستم.
        </h1>

        <p>
            دستیار هوشمند همه‌کاره تو
        </p>

    </section>

    <section id="chat"></section>

    <div class="input-area">

        <textarea
            id="message"
            placeholder="از ZODIAC چیزی بپرس..."
        ></textarea>

        <button id="send">➤</button>

    </div>

</main>

<script src="app.js"></script>

</body>
</html>
