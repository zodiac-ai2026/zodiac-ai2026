<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070707">

    <title>ZODIAC AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="topbar">

        <div class="logo">
            ZODIAC
        </div>

        <button
            id="menuBtn"
            class="menu-btn"
            aria-label="باز کردن منو"
            type="button"
        >
            ☰
        </button>

    </header>


    <!-- SIDE MENU -->
    <aside id="menu" class="side-menu">

        <div class="menu-header">
            <div class="menu-logo">✦ ZODIAC</div>
            <div class="menu-subtitle">AI Assistant</div>
        </div>

        <button class="menu-item" type="button">
            <span>💬</span>
            <span>چت هوشمند</span>
        </button>

        <button class="menu-item" type="button">
            <span>💻</span>
            <span>برنامه‌نویسی</span>
        </button>

        <button class="menu-item" type="button">
            <span>🎨</span>
            <span>ساخت تصویر</span>
        </button>

        <button class="menu-item" type="button">
            <span>✏️</span>
            <span>ویرایش تصویر</span>
        </button>

        <button class="menu-item" type="button">
            <span>📁</span>
            <span>فایل‌ها</span>
        </button>

        <button class="menu-item" type="button">
            <span>🌐</span>
            <span>جست‌وجوی وب</span>
        </button>

        <button class="menu-item" type="button">
            <span>🎙️</span>
            <span>صدا</span>
        </button>

        <button class="menu-item" type="button">
            <span>🧠</span>
            <span>حافظه</span>
        </button>

    </aside>


    <!-- OVERLAY -->
    <div id="overlay" class="overlay"></div>


    <!-- MAIN -->
    <main class="main">

        <section class="welcome">

            <div class="zodiac-icon">
                ✦
            </div>

            <h1>
                سلام، من
                <span>ZODIAC</span>
                هستم.
            </h1>

            <p>
                دستیار هوشمند همه‌کاره تو
            </p>

        </section>


        <!-- CHAT -->
        <section
            id="chat"
            class="chat"
            aria-live="polite"
        ></section>

    </main>


    <!-- INPUT -->
    <div class="input-wrapper">

        <div class="input-area">

            <textarea
                id="message"
                rows="1"
                placeholder="از ZODIAC چیزی بپرس..."
                autocomplete="off"
            ></textarea>

            <button
                id="send"
                type="button"
                aria-label="ارسال پیام"
            >
                ➤
            </button>

        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
